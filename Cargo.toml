[package]
name = "openrust"
version = "0.1.0"
edition = "2021"
description = "A coding agent CLI + TUI inspired by opencode, written in Rust"

[[bin]]
name = "openrust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "time",
    "sync",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
    "http2",
] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
regex = "1"
glob = "0.3"
textwrap = "0.16"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
